<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Examen Final</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-9">
                <div class="card" id="chat-container">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-0">Chat General</h5>
                            <small>Usuario: <span id="currentUser"></span></small>
                        </div>
                        <button id="logoutButton" class="btn btn-sm btn-outline-light">Cerrar Sesión</button>
                    </div>
                    <div class="card-body" id="chatHistory" style="max-height: 60vh; overflow-y: auto;">
                        <!-- Los mensajes se cargarán aquí -->
                    </div>
                    <div class="card-footer">
                        <form id="messageForm" class="d-flex gap-2">
                            <input type="text" class="form-control" id="messageContent" placeholder="Escribe un mensaje..." required autocomplete="off">
                            <button type="submit" class="btn btn-primary">Enviar</button>
                        </form>
                        <div id="messageResponse" class="mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/chat.js"></script>
</body>
</html>
